name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-feynman-1psqhi]
    paths: ['asistente-expedientes/**', '.github/workflows/instalador-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: asistente-expedientes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: asistente-expedientes/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Asistente-de-Expedientes-Windows
          path: asistente-expedientes/dist/*.exe
